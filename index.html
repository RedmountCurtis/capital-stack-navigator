<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Stack Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#333333; --ink-soft:#6B6B6B;
    --paper:#F5F3EE; --paper-raised:#FFFFFF;
    --line:#E1DDD1; --line-strong:#C9C4B4;
    --maroon:#B8272E; --maroon-soft:#F3E2DF;
    --forest:#2F5233; --forest-soft:#E7EEE6;
    --amber:#9C6B18; --amber-soft:#F3EAD6;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; }
  #app{display:flex; min-height:100vh;}

  /* ---------- Auth gate (shared SSO w/ Redmount Terminal) ---------- */
  .authgate{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; }
  .authcard{ background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; width:100%; max-width:380px; padding:32px 32px 26px; box-shadow:0 8px 24px -12px rgba(51,51,51,0.18); }
  .authcard .auth-logo{ margin-bottom:20px; display:flex; flex-direction:column; gap:2px; }
  .authcard .logo-mount{ font-family:var(--sans); font-weight:700; font-size:19px; letter-spacing:.03em; color:var(--ink); }
  .authcard .logo-capital{ font-family:var(--mono); font-weight:600; font-size:10.5px; letter-spacing:.14em; color:var(--maroon); }
  .authcard h1{ font-family:var(--serif); font-size:21px; margin:14px 0 4px; color:var(--ink); }
  .authcard p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 22px; }
  .authcard label{ display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; margin-top:16px; }
  .authcard input{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:4px; font-size:13.5px; font-family:var(--sans); box-sizing:border-box; background:var(--paper); color:var(--ink); }
  .authcard input:focus{ outline:none; border-color:var(--maroon); }
  .authcard button#authSubmit{ width:100%; margin-top:20px; padding:11px; background:var(--maroon); border:1px solid var(--maroon);
    color:#fff; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--sans); letter-spacing:.02em; }
  .authcard button#authSubmit:hover{ background:#942028; }
  .authcard button#authSubmit:disabled{ opacity:.6; cursor:not-allowed; }
  .authcard .err{ font-size:12.5px; color:var(--maroon); margin-top:10px; display:none; }
  .authcard .err.show{ display:block; }

  /* ---------- Sidebar ---------- */
  .sidebar{ width:250px; flex-shrink:0; background:var(--ink); color:#EDEAE3; padding:26px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.01em; line-height:1.25; margin-bottom:2px; }
  .brand-sub{ font-size:10px; letter-spacing:0.13em; text-transform:uppercase; color:#C4BEB1; margin-bottom:22px; font-weight:500; }
  .new-assess-btn{ width:100%; background:var(--maroon); border:1px solid var(--maroon); color:#fff; font-family:var(--sans); font-size:12.5px;
    font-weight:600; padding:9px 10px; border-radius:4px; cursor:pointer; margin-bottom:18px; }
  .new-assess-btn:hover{ background:#942028; }
  .sidebar-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#C4BEB1; font-weight:600; margin-bottom:8px; }
  .assess-item{ padding:9px 10px; margin-bottom:3px; border-radius:3px; font-size:12.5px; cursor:pointer; color:#EDEAE3; border-left:2px solid transparent; }
  .assess-item:hover{ background:rgba(255,255,255,0.06); }
  .assess-item.active{ background:rgba(255,255,255,0.09); border-left:2px solid #EE9DA1; }
  .assess-item .a-name{ font-weight:600; }
  .assess-item .a-meta{ color:#C4BEB1; font-size:10.5px; margin-top:2px; }
  .empty-hint{ font-size:11.5px; color:#C4BEB1; line-height:1.6; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#C4BEB1; line-height:1.6; }
  .signout-link{ color:#EE9DA1; cursor:pointer; font-weight:600; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:34px 46px 90px; max-width:900px; }
  .page-title{ font-family:var(--serif); font-size:25px; font-weight:600; margin:0 0 4px; }
  .page-desc{ color:var(--ink-soft); font-size:13.5px; max-width:600px; margin:0 0 30px; line-height:1.55; }

  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px; }
  .field input[type=text]{ width:100%; max-width:420px; padding:10px 12px; border:1px solid var(--line-strong); border-radius:4px; font-size:13.5px; font-family:var(--sans); background:var(--paper-raised); color:var(--ink); }
  .field input:focus{ outline:none; border-color:var(--maroon); }
  .opt-grid{ display:flex; flex-direction:column; gap:8px; }
  .opt-grid.cols2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt{ display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border:1px solid var(--line-strong); border-radius:5px; cursor:pointer; background:var(--paper-raised); transition:border-color .12s, background .12s; }
  .opt:hover{ border-color:var(--maroon); }
  .opt.selected{ border-color:var(--maroon); background:var(--maroon-soft); }
  .opt input{ margin-top:2px; accent-color:var(--maroon); }
  .opt .opt-label{ font-size:13px; font-weight:600; }
  .opt .opt-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .section-divider{ height:1px; background:var(--line); margin:30px 0; }
  .section-head{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--maroon); font-weight:700; margin-bottom:16px; }

  .btn{ font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; padding:11px 22px; border-radius:4px; border:1px solid var(--maroon); background:var(--maroon); color:#fff; }
  .btn:hover{ background:#942028; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn-ghost{ background:none; color:var(--ink-soft); border:1px solid var(--line-strong); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); background:none; }
  .btn-row{ display:flex; gap:10px; margin-top:10px; }

  /* ---------- Results ---------- */
  .result-banner{ background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:26px 28px; margin-bottom:26px; }
  .result-eyebrow{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--maroon); font-weight:700; margin-bottom:8px; }
  .result-title{ font-family:var(--serif); font-size:23px; font-weight:600; margin:0 0 10px; }
  .result-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; max-width:600px; }
  .score-strip{ display:flex; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:20px; }
  .score-cell{ flex:1; background:var(--paper-raised); padding:12px 14px; }
  .score-cell.top{ background:var(--maroon-soft); }
  .score-lbl{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:4px; }
  .score-val{ font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink); }

  .bucket-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:22px 24px; margin-bottom:16px; }
  .bucket-card h3{ font-family:var(--serif); font-size:16px; margin:0 0 10px; }
  .pc-cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:640px){ .pc-cols{ grid-template-columns:1fr; } }
  .pc-col h4{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px; }
  .pc-col.pros h4{ color:var(--forest); }
  .pc-col.cons h4{ color:var(--maroon); }
  .pc-col ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.65; color:var(--ink); }
  .routing-note{ background:var(--amber-soft); border:1px solid #E5D3A8; border-radius:6px; padding:14px 16px; font-size:12.5px; color:#6b4d10; line-height:1.6; margin-top:6px; }
  .save-note{ font-size:11.5px; color:var(--ink-soft); margin-top:18px; }
  .save-note input{ padding:8px 10px; border:1px solid var(--line-strong); border-radius:4px; font-size:13px; margin-left:6px; width:220px; }
</style>
</head>
<body>
<div class="authgate" id="authGate">
  <div class="authcard">
    <div class="auth-logo"><span class="logo-mount">REDMOUNT</span><span class="logo-capital">CAPITAL PARTNERS</span></div>
    <h1>Capital Stack Navigator</h1>
    <p class="sub">Sign in to access the workspace.</p>
    <label>Email</label>
    <input type="email" id="authEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button id="authSubmit">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app" style="display:none;"></div>

<script>
/* =========================================================================
   CAPITAL STACK NAVIGATOR — advisory triage wizard.
   Walks a prospect's situation across use of proceeds, control/dilution
   tolerance, collateral, leverage, timeline, and cash-flow profile, then
   recommends a capital-stack bucket (Debt-only / Debt+Mezz / Equity
   conversation) with qualitative pros/cons. No cost figures are computed
   for equity or mezzanine — those are soft, sponsor-specific numbers this
   tool has no visibility into, and presenting them as precise would be
   misleading. Debt-bucket results route into the existing Cobalt debt
   tools; equity/mezz results just flag who to loop in.
   ========================================================================= */

const SUPABASE_URL = 'https://pdympbpyavilstjsmjtm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkeW1wYnB5YXZpbHN0anNtanRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc1NjUsImV4cCI6MjEwMTM2MzU2NX0.zb-moqwGSoOB-rq9OSqk6cLt0JqXlzRBLebMLE2R4DA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'capital_stack_assessments';

// Cobalt's Debt Capacity Calculator — used as the handoff target for debt-bucket
// results. Query params are best-effort; verify field names against that tool's
// actual URL-param handling before relying on them to prefill anything.
const DEBT_CALC_URL = 'https://cobaltcommercialcredit.github.io/cobalt-debt-capacity-calc/';

/* ---------------------------- Auth (shared SSO) --------------------------- */
const AUTH = SUPABASE_URL + '/auth/v1';
const SESSION_KEY = 'redmount_session';
function $(id){ return document.getElementById(id); }
async function authSignIn(email, password){
  const res = await fetch(AUTH + '/token?grant_type=password', {
    method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
  return data;
}
async function authRefresh(refreshToken){
  const res = await fetch(AUTH + '/token?grant_type=refresh_token', {
    method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  const data = await res.json();
  if(!res.ok) throw new Error('refresh failed');
  return data;
}
function saveSession(data){
  const session = { access_token:data.access_token, refresh_token:data.refresh_token,
    expires_at: Date.now() + (data.expires_in||3600)*1000, email: data.user && data.user.email };
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  return session;
}
function loadStoredSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function ensureValidSession(){
  const session = loadStoredSession();
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{ return saveSession(await authRefresh(session.refresh_token)); }
  catch(e){ clearSession(); return null; }
}
function showAuthErr(msg){ $('authErr').textContent = msg; $('authErr').classList.add('show'); }
function enterApp(){
  $('authGate').style.display = 'none';
  $('app').style.display = 'flex';
  loadAssessments();
}
function showAuthGate(){
  $('authGate').style.display = 'flex';
  $('app').style.display = 'none';
}
$('authSubmit').addEventListener('click', async ()=>{
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  if(!email || !password){ showAuthErr('Enter an email and password.'); return; }
  const btn = $('authSubmit'); btn.disabled = true;
  try{
    const data = await authSignIn(email, password);
    const session = saveSession(data);
    sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });
    enterApp();
  }catch(e){ showAuthErr(e.message || 'Incorrect email or password'); }
  btn.disabled = false;
});

/* ---------------------------- Wizard config --------------------------- */
const STEPS = [
  { key:'useOfProceeds', label:'Use of Proceeds', options:[
    {v:'growth', t:'Growth capital', s:'Expansion, hiring, new location, inventory build'},
    {v:'acquisition', t:'Acquisition', s:'Buying another business or a book of business'},
    {v:'recap', t:'Recapitalization / partial buyout', s:'Buying out a partner, taking chips off the table'},
    {v:'refi', t:'Refinance existing debt', s:'Replacing or restructuring current obligations'},
    {v:'workingcapital', t:'Working capital', s:'Smoothing cash flow, funding receivables/payables gap'},
    {v:'cre', t:'CRE purchase or refinance', s:'Owner-occupied real estate transaction'},
  ]},
  { key:'controlTolerance', label:'Control Tolerance', options:[
    {v:'keep100', t:'Keep 100% control', s:'Not willing to add a board seat or outside vote'},
    {v:'minority', t:'Open to a minority stake', s:'Willing to bring in an outside investor below 50%'},
    {v:'majority', t:'Open to a majority or full sale', s:'Willing to give up control or exit entirely'},
  ]},
  { key:'dilutionTolerance', label:'Dilution Tolerance', options:[
    {v:'none', t:'None', s:'Not willing to give up any equity'},
    {v:'upto20', t:'Up to ~20%', s:''},
    {v:'20to49', t:'20%–49%', s:''},
    {v:'majority', t:'Open to giving up majority', s:''},
  ]},
  { key:'collateral', label:'Collateral Available', options:[
    {v:'arinv', t:'AR / Inventory', s:''},
    {v:'equipment', t:'Equipment', s:''},
    {v:'re', t:'Real estate', s:''},
    {v:'none', t:'None / unsecured', s:'No hard assets to pledge'},
  ], multi:true },
  { key:'leverage', label:'Current Leverage', options:[
    {v:'light', t:'Light', s:'Under ~2x EBITDA'},
    {v:'moderate', t:'Moderate', s:'Roughly 2x–4x EBITDA'},
    {v:'heavy', t:'Highly levered', s:'Over ~4x EBITDA'},
  ]},
  { key:'timeline', label:'Timeline to Close', options:[
    {v:'urgent', t:'Under 30 days', s:''},
    {v:'standard', t:'30–90 days', s:''},
    {v:'flexible', t:'Flexible / 90+ days', s:''},
  ]},
  { key:'cashFlow', label:'Cash Flow Profile', options:[
    {v:'stable', t:'Profitable and stable', s:''},
    {v:'growing', t:'Growing, but thin margins', s:''},
    {v:'preprofit', t:'Pre-profit or burning cash', s:''},
  ]},
  { key:'ownershipGoal', label:'Post-Close Ownership Goal', optional:true, options:[
    {v:'hold', t:'Hold indefinitely', s:''},
    {v:'exit35', t:'Exit in 3–5 years', s:''},
    {v:'exit510', t:'Exit in 5–10 years', s:''},
    {v:'undecided', t:'Undecided', s:''},
  ]},
];

const BUCKET_CONTENT = {
  debt: {
    title:'Debt-Only', eyebrow:'Recommended Path',
    desc:'The profile here points to a straightforward debt solution — no need to give up equity or control to get this done.',
    pros:['Keeps 100% ownership and control','Interest is deductible; principal builds equity, not someone else\'s upside','Fastest path to close of the three','Cost is a known, fixed number — not an assumption'],
    cons:['Requires debt service regardless of performance','Collateral or covenants may be required depending on structure','Leverage capacity is finite — doesn\'t solve for businesses that can\'t support the payment'],
  },
  mezz: {
    title:'Debt + Mezzanine', eyebrow:'Recommended Path',
    desc:'Senior debt alone likely doesn\'t cover the full need here. A blended structure — senior debt plus a subordinated piece — can close the gap without a full equity raise.',
    pros:['Preserves more ownership than a straight equity raise','Can bridge a gap senior lenders won\'t reach','Current-pay coupon is known; PIK/kicker terms are negotiable, not fixed by a third party\'s underwriting'],
    cons:['More expensive than senior debt alone','Often includes warrants or an equity kicker — some dilution, just less than a straight raise','Adds a second lender relationship and intercreditor complexity'],
  },
  equity: {
    title:'Equity Conversation Needed', eyebrow:'Refer, Don\'t Model',
    desc:'This profile is outside what a debt-underwriting lens can responsibly size — either the risk tolerance, control willingness, or cash flow profile points toward an equity conversation instead.',
    pros:['Can fund things debt can\'t underwrite (pre-profit, high leverage, true control sale)','No fixed debt service — investor is aligned on the same outcome','Can bring more than capital — board experience, operating help, follow-on capacity'],
    cons:['Real dilution and typically a board seat / voting rights','Cost is a function of an assumed future exit value — soft, not a number this tool should quote','Process is materially slower than a debt closing'],
  },
};

/* ---------------------------- Scoring --------------------------- */
function scoreAssessment(a){
  let debt=0, mezz=0, equity=0;
  const add = (d,m,e)=>{ debt+=d; mezz+=m; equity+=e; };

  switch(a.controlTolerance){
    case 'keep100': add(3,1,0); break;
    case 'minority': add(0,2,1); break;
    case 'majority': add(0,0,3); break;
  }
  switch(a.dilutionTolerance){
    case 'none': add(3,0,0); break;
    case 'upto20': add(1,2,0); break;
    case '20to49': add(0,1,2); break;
    case 'majority': add(0,0,3); break;
  }
  switch(a.cashFlow){
    case 'stable': add(3,1,0); break;
    case 'growing': add(1,2,1); break;
    case 'preprofit': add(-2,0,3); break;
  }
  switch(a.leverage){
    case 'light': add(2,1,0); break;
    case 'moderate': add(0,1,1); break;
    case 'heavy': add(-2,1,2); break;
  }
  const secured = (a.collateral||[]).some(c=>c!=='none') && (a.collateral||[]).length>0;
  if(secured) add(2,1,0); else add(0,1,1);

  switch(a.useOfProceeds){
    case 'acquisition': add(0,1,1); break;
    case 'recap': add(0,1,2); break;
    case 'refi': case 'workingcapital': case 'cre': add(2,0,0); break;
    case 'growth': add(1,1,0); break;
  }
  switch(a.timeline){
    case 'urgent': add(2,0,-1); break;
    case 'flexible': add(0,0,1); break;
  }

  // Hard overrides — situations where the math above could technically favor debt
  // but the deal is not one a lender will underwrite, or is structurally an M&A
  // transaction rather than a financing.
  let bucket;
  if(a.controlTolerance === 'majority'){
    bucket = 'equity';
  } else if(a.cashFlow === 'preprofit' && !secured){
    bucket = 'equity';
  } else {
    if(debt >= mezz && debt >= equity) bucket = 'debt';
    else if(mezz >= equity) bucket = 'mezz';
    else bucket = 'equity';
  }
  return { debt, mezz, equity, bucket };
}

/* ---------------------------- State --------------------------- */
let assessments = [];
let currentId = null;   // null = new/unsaved
let draft = null;       // in-progress answers for the wizard
let view = 'new';       // 'new' | 'result'
let saveState = 'idle';

function blankDraft(){
  return { prospectName:'', companyName:'', useOfProceeds:'', controlTolerance:'', dilutionTolerance:'',
    collateral:[], leverage:'', timeline:'', cashFlow:'', ownershipGoal:'' };
}

async function loadAssessments(){
  try{
    const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending:false });
    if(error) throw error;
    assessments = data || [];
  }catch(e){
    console.error('load failed', e);
    assessments = [];
  }
  render();
}

async function persistAssessment(a){
  saveState = 'saving'; render();
  const payload = {
    prospect_name: a.prospectName || null, company_name: a.companyName || null,
    inputs: {
      useOfProceeds:a.useOfProceeds, controlTolerance:a.controlTolerance, dilutionTolerance:a.dilutionTolerance,
      collateral:a.collateral, leverage:a.leverage, timeline:a.timeline, cashFlow:a.cashFlow, ownershipGoal:a.ownershipGoal
    },
    recommended_bucket: a.result ? a.result.bucket : null,
  };
  try{
    if(a.id){
      const { error } = await sb.from(TABLE).update(payload).eq('id', a.id);
      if(error) throw error;
    } else {
      const { data, error } = await sb.from(TABLE).insert(payload).select().single();
      if(error) throw error;
      a.id = data.id;
    }
    saveState = 'saved';
    await loadAssessments();
    currentId = a.id;
  }catch(e){
    console.error('save failed', e);
    saveState = 'error';
    render();
  }
}

function startNew(){
  draft = blankDraft();
  currentId = null;
  view = 'new';
  render();
}

function openSaved(id){
  const rec = assessments.find(x=>x.id===id);
  if(!rec) return;
  draft = { prospectName: rec.prospect_name||'', companyName: rec.company_name||'', ...rec.inputs };
  draft.result = scoreAssessment(draft);
  currentId = id;
  view = 'result';
  render();
}

function isComplete(d){
  return d.useOfProceeds && d.controlTolerance && d.dilutionTolerance && d.collateral.length &&
    d.leverage && d.timeline && d.cashFlow;
}

/* ---------------------------- Render --------------------------- */
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function renderSidebar(){
  const items = assessments.map(a=>{
    const active = a.id===currentId ? 'active' : '';
    const name = a.prospect_name || a.company_name || 'Untitled';
    const bucketLbl = a.recommended_bucket ? (BUCKET_CONTENT[a.recommended_bucket]||{}).title : '—';
    return `<div class="assess-item ${active}" data-open="${a.id}">
      <div class="a-name">${escapeHtml(name)}</div>
      <div class="a-meta">${escapeHtml(bucketLbl||'')} · ${fmtDate(a.created_at)}</div>
    </div>`;
  }).join('');
  return `
  <div class="sidebar">
    <div class="brand">Capital Stack</div>
    <div class="brand-sub">Navigator</div>
    <button class="new-assess-btn" id="newAssessBtn">+ New Assessment</button>
    <div class="sidebar-section-label">Saved Assessments</div>
    ${assessments.length ? items : '<div class="empty-hint">Nothing saved yet — run an assessment and save it to see it here.</div>'}
    <div class="sidebar-foot">Advisory tool — Redmount Capital Partners.<br>Debt-bucket results route to Cobalt's Debt Capacity Calculator.<br><span class="signout-link" id="signOutBtn">Sign out</span></div>
  </div>`;
}

function optionHtml(step, val){
  const selected = step.multi ? (val||[]).includes.bind(val||[]) : (v)=>val===v;
  return `<div class="opt-grid ${step.options.length>4?'cols2':''}">` + step.options.map(o=>{
    const isSel = step.multi ? (val||[]).includes(o.v) : val===o.v;
    return `<label class="opt ${isSel?'selected':''}">
      <input type="${step.multi?'checkbox':'radio'}" name="${step.key}" value="${o.v}" ${isSel?'checked':''}>
      <div><div class="opt-label">${escapeHtml(o.t)}</div>${o.s?`<div class="opt-sub">${escapeHtml(o.s)}</div>`:''}</div>
    </label>`;
  }).join('') + `</div>`;
}

function renderWizard(){
  const d = draft;
  const stepsHtml = STEPS.map(step=>`
    <div class="field">
      <label>${step.label}${step.optional?' (optional)':''}</label>
      ${optionHtml(step, d[step.key])}
    </div>
  `).join('');

  return `
  <div class="main">
    <div class="page-title">Capital Stack Navigator</div>
    <div class="page-desc">Walk through a prospect's situation to get a directional read on whether debt, a blended debt+mezz structure, or an equity conversation fits best. This is a triage tool, not a cost quote — equity and mezzanine figures are never modeled here, only debt.</div>

    <div class="field">
      <label>Prospect / Contact Name</label>
      <input type="text" id="prospectName" value="${escapeHtml(d.prospectName)}" placeholder="e.g. Dana Whitfield">
    </div>
    <div class="field">
      <label>Company Name</label>
      <input type="text" id="companyName" value="${escapeHtml(d.companyName)}" placeholder="e.g. Whitfield Manufacturing">
    </div>
    <div class="section-divider"></div>
    ${stepsHtml}

    <div class="btn-row">
      <button class="btn" id="runAssessBtn" ${isComplete(d)?'':'disabled'}>Run Assessment</button>
    </div>
  </div>`;
}

function renderResult(){
  const d = draft;
  const r = d.result;
  const bucket = BUCKET_CONTENT[r.bucket];
  const total = Math.max(1, r.debt + r.mezz + r.equity);
  const cells = [['Debt', r.debt, r.bucket==='debt'],['Mezz', r.mezz, r.bucket==='mezz'],['Equity', r.equity, r.bucket==='equity']];

  const debtLinkHtml = r.bucket==='debt' || r.bucket==='mezz'
    ? `<div class="btn-row"><a class="btn" style="text-decoration:none;" href="${DEBT_CALC_URL}" target="_blank">Open Debt Capacity Calculator →</a></div>`
    : `<div class="routing-note">This is an equity conversation — loop in whoever's handling that relationship. No cost figures are generated here; equity and mezzanine pricing depend on sponsor-specific underwriting this tool has no visibility into.</div>`;

  return `
  <div class="main">
    <div class="btn-row" style="margin-bottom:20px;">
      <button class="btn btn-ghost" id="backToWizardBtn">← Edit Answers</button>
      <button class="btn btn-ghost" id="newFromResultBtn">+ New Assessment</button>
    </div>

    <div class="result-banner">
      <div class="result-eyebrow">${escapeHtml(bucket.eyebrow)}</div>
      <div class="result-title">${escapeHtml(bucket.title)}</div>
      <div class="result-desc">${escapeHtml(bucket.desc)}</div>
      <div class="score-strip">
        ${cells.map(([lbl,val,top])=>`<div class="score-cell ${top?'top':''}"><div class="score-lbl">${lbl} Signal</div><div class="score-val">${val}</div></div>`).join('')}
      </div>
    </div>

    <div class="bucket-card">
      <h3>Pros &amp; Cons</h3>
      <div class="pc-cols">
        <div class="pc-col pros"><h4>Pros</h4><ul>${bucket.pros.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul></div>
        <div class="pc-col cons"><h4>Cons</h4><ul>${bucket.cons.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul></div>
      </div>
    </div>

    ${debtLinkHtml}

    <div class="save-note">
      ${saveState==='saved' ? 'Saved.' : saveState==='saving' ? 'Saving…' : saveState==='error' ? 'Save failed — check console.' : ''}
      <button class="btn" style="margin-top:12px;" id="saveAssessBtn">${currentId?'Update Saved Assessment':'Save Assessment'}</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = $('app');
  app.innerHTML = renderSidebar() + (view==='result' ? renderResult() : renderWizard());
  wire();
}

function wire(){
  const newBtn = $('newAssessBtn'); if(newBtn) newBtn.onclick = startNew;
  const signOut = $('signOutBtn'); if(signOut) signOut.onclick = ()=>{ clearSession(); showAuthGate(); };
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=> openSaved(el.dataset.open);
  });

  if(view==='new'){
    const pn = $('prospectName'); if(pn) pn.oninput = ()=>{ draft.prospectName = pn.value; };
    const cn = $('companyName'); if(cn) cn.oninput = ()=>{ draft.companyName = cn.value; };
    document.querySelectorAll('.opt input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const step = STEPS.find(s=>s.key===inp.name);
        if(step.multi){
          const set = new Set(draft[step.key]||[]);
          if(inp.checked) set.add(inp.value); else set.delete(inp.value);
          draft[step.key] = Array.from(set);
        } else {
          draft[step.key] = inp.value;
        }
        render();
      });
    });
    const runBtn = $('runAssessBtn');
    if(runBtn) runBtn.onclick = ()=>{
      if(!isComplete(draft)) return;
      draft.result = scoreAssessment(draft);
      view = 'result';
      saveState = 'idle';
      render();
    };
  }

  if(view==='result'){
    const back = $('backToWizardBtn'); if(back) back.onclick = ()=>{ view='new'; render(); };
    const again = $('newFromResultBtn'); if(again) again.onclick = startNew;
    const save = $('saveAssessBtn'); if(save) save.onclick = ()=> persistAssessment(draft);
  }
}

(async function init(){
  draft = blankDraft();
  const session = await ensureValidSession();
  if(session){
    sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });
    enterApp();
  } else {
    showAuthGate();
  }
})();
</script>
</body>
</html>
