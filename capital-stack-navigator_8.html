<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

  .authcard .logo-capital{ font-family:var(--mono); font-weight:600; font-size:10.5px; letter-spacing:.14em; color:var(--maroon); }
  .authcard h1{ font-family:var(--serif); font-size:21px; margin:14px 0 4px; color:var(--ink); }
  .authcard p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 22px; }
  .authcard label{ display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; margin-top:16px; }
  .authcard input{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:4px; font-size:13.5px; font-family:var(--sans); box-sizing:border-box; background:var(--paper); color:var(--ink); }

    color:#fff; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--sans); letter-spacing:.02em; }
  .authcard button#authSubmit:hover{ background:#1a4b8c; }
  .authcard button#authSubmit:disabled{ opacity:.6; cursor:not-allowed; }
  .authcard .err{ font-size:12.5px; color:var(--maroon); margin-top:10px; display:none; }
  .authcard .err.show{ display:block; }

  /* ---------- Sidebar ---------- */
  .sidebar{ width:250px; flex-shrink:0; background:#002347; color:#E8ECF3; padding:26px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.01em; line-height:1.25; margin-bottom:2px; color:#fff; }
  .brand-sub{ font-size:10px; letter-spacing:0.13em; text-transform:uppercase; color:#9FB3D6; margin-bottom:22px; font-weight:500; }
  .new-assess-btn{ width:100%; background:#0047AB; border:1px solid #0047AB; color:#fff; font-family:var(--sans); font-size:12.5px;
    font-weight:600; padding:9px 10px; border-radius:4px; cursor:pointer; margin-bottom:18px; }
  .new-assess-btn:hover{ background:#1a4b8c; }
  .sidebar-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#9FB3D6; font-weight:600; margin-bottom:8px; }
  .assess-item{ padding:9px 10px; margin-bottom:3px; border-radius:3px; font-size:12.5px; cursor:pointer; color:#C4D3EA; border-left:2px solid transparent; }
  .assess-item:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .assess-item.active{ background:rgba(255,255,255,0.1); color:#fff; font-weight:700; border-left:2px solid #4a7fc4; }
  .assess-item .a-name{ font-weight:600; }
  .assess-item .a-meta{ color:#9FB3D6; font-size:10.5px; margin-top:2px; }

  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12); font-size:11px; color:#9FB3D6; line-height:1.6; }
  .tool-switcher-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#9FB3D6; font-weight:600; margin-bottom:7px; }

  .save-note{ font-size:11.5px; color:var(--ink-soft); margin-top:18px; }
  .save-note input{ padding:8px 10px; border:1px solid var(--line-strong); border-radius:4px; font-size:13px; margin-left:6px; width:220px; }

  .cost-note-top{ font-size:12.5px; color:var(--ink-soft); margin:-4px 0 18px; line-height:1.55; }

  .cost-col label{ display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:8px 0 3px; }
  .cost-col input{ width:100%; padding:6px 8px; border:1px solid var(--line-strong); border-radius:3px; font-size:12.5px; font-family:var(--mono); background:var(--paper-raised); color:var(--ink); }
  .cost-col input:focus{ outline:none; border-color:var(--maroon); }
  .cost-output{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .cost-annual{ font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink); }
  .cost-pct{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .cost-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }

  .wf-tests{ border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .wf-row{ display:flex; justify-content:space-between; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--line); background:var(--paper-raised); }
  .wf-row:last-child{ border-bottom:none; }
  .wf-row.binding{ background:var(--maroon-soft); font-weight:700; }
  .wf-val{ font-family:var(--mono); }
  .wf-split{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .wf-split-cell{ background:var(--paper-raised); padding:14px; }
  .wf-split-lbl{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px; }
  .wf-split-val{ font-family:var(--serif); font-size:18px; font-weight:600; }

  @media print{
    .sidebar, .btn-row, .signout-fixed, .authgate{ display:none !important; }
    .main{ max-width:100%; padding:0; }
    .cost-col input, .fin-field input{ border:none; background:none; padding:2px 0; }
    body{ background:#fff; }
  }
</style>

<body>
<div class="authgate" id="authGate">
  <div class="authcard">
    <div class="auth-logo"><span class="logo-mount">REDMOUNT</span><span class="logo-capital">CAPITAL PARTNERS</span></div>
    <h1>Capital Stack Navigator</h1>
    <p class="sub">Sign in to access the workspace.</p>

<div id="app" style="display:none;"></div>

<script>
/* =========================================================================
   CAPITAL STACK NAVIGATOR — advisory triage wizard.
   Walks a prospect's situation across use of proceeds, control/dilution
   tolerance, collateral, leverage, timeline, and cash-flow profile, then
   recommends a capital-stack bucket (Debt-only / Debt+Mezz / Equity
   conversation) with qualitative pros/cons. No cost figures are computed
   for equity or mezzanine — those are soft, sponsor-specific numbers this
   tool has no visibility into, and presenting them as precise would be
   misleading. Debt-bucket results route into the existing Cobalt debt
   tools; equity/mezz results just flag who to loop in.
   ========================================================================= */

const SUPABASE_URL = 'https://pdympbpyavilstjsmjtm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkeW1wYnB5YXZpbHN0anNtanRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc1NjUsImV4cCI6MjEwMTM2MzU2NX0.zb-moqwGSoOB-rq9OSqk6cLt0JqXlzRBLebMLE2R4DA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'capital_stack_assessments';

// Cobalt's Debt Capacity Calculator — used as the handoff target for debt-bucket
// results. Query params are best-effort; verify field names against that tool's
// actual URL-param handling before relying on them to prefill anything.
const DEBT_CALC_URL = 'https://cobaltcommercialcredit.github.io/cobalt-debt-capacity-calc/';

/* ---------------------------- Auth (shared SSO) --------------------------- */
const AUTH = SUPABASE_URL + '/auth/v1';
const SESSION_KEY = 'redmount_session';
function $(id){ return document.getElementById(id); }
async function authSignIn(email, password){
  const res = await fetch(AUTH + '/token?grant_type=password', {
    method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
  return data;
}
async function authRefresh(refreshToken){
  const res = await fetch(AUTH + '/token?grant_type=refresh_token', {
    method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  const data = await res.json();
  if(!res.ok) throw new Error('refresh failed');
  return data;
}
function saveSession(data){
  const session = { access_token:data.access_token, refresh_token:data.refresh_token,
    expires_at: Date.now() + (data.expires_in||3600)*1000, email: data.user && data.user.email };
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  return session;
}
function loadStoredSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function ensureValidSession(){
  const session = loadStoredSession();
  if(!session) return null;
  if(Date.now() < session.expires_at - 60000) return session;
  try{ return saveSession(await authRefresh(session.refresh_token)); }
  catch(e){ clearSession(); return null; }
}
function showAuthErr(msg){ $('authErr').textContent = msg; $('authErr').classList.add('show'); }
function enterApp(){
  $('authGate').style.display = 'none';
  $('app').style.display = 'flex';
  loadAssessments();
}
function showAuthGate(){
  $('authGate').style.display = 'flex';
  $('app').style.display = 'none';
}
$('authSubmit').addEventListener('click', async ()=>{
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  if(!email || !password){ showAuthErr('Enter an email and password.'); return; }
  const btn = $('authSubmit'); btn.disabled = true;
  try{
    const data = await authSignIn(email, password);
    const session = saveSession(data);
    sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });
    enterApp();
  }catch(e){ showAuthErr(e.message || 'Incorrect email or password'); }
  btn.disabled = false;
});

/* ---------------------------- Financial statement inputs & debt capacity engine --------------------------- */
function n(v){ return Number(v) || 0; }

function defaultFinancials(){
  return {
    // Income Statement (single most-recent-period / TTM)
    revenue:'', cogs:'', opex:'', da:'', interestExpense:'', taxRate:25,
    // Balance Sheet
    cash:'', ar:'', inventory:'', otherCurrentAssets:'',
    ppe:'', realEstate:'', otherLTAssets:'',
    ap:'', otherCurrentLiabilities:'',
    existingSeniorDebt:'', existingSubDebt:'', otherLTLiabilities:'',
    // Debt capacity assumptions
    maxLeverageMultiple:3.0, minDSCR:1.25,
    arAdvanceRate:80, invAdvanceRate:50, reAdvanceRate:70,
  };
}

function computeIncomeStatement(f){
  const revenue=n(f.revenue), cogs=n(f.cogs), opex=n(f.opex), da=n(f.da), interestExpense=n(f.interestExpense), taxRate=n(f.taxRate);
  const grossProfit = revenue - cogs;
  const ebitda = grossProfit - opex;
  const ebit = ebitda - da;
  const ebt = ebit - interestExpense;
  const taxes = Math.max(0, ebt) * (taxRate/100);
  const netIncome = ebt - taxes;
  return { revenue, grossProfit, ebitda, ebit, ebt, taxes, netIncome };
}

function computeBalanceSheet(f){
  const cash=n(f.cash), ar=n(f.ar), inventory=n(f.inventory), otherCA=n(f.otherCurrentAssets);
  const totalCurrentAssets = cash+ar+inventory+otherCA;
  const ppe=n(f.ppe), realEstate=n(f.realEstate), otherLTAssets=n(f.otherLTAssets);
  const totalAssets = totalCurrentAssets + ppe + realEstate + otherLTAssets;
  const ap=n(f.ap), otherCL=n(f.otherCurrentLiabilities);
  const totalCurrentLiabilities = ap+otherCL;
  const existingSeniorDebt=n(f.existingSeniorDebt), existingSubDebt=n(f.existingSubDebt), otherLTLiabilities=n(f.otherLTLiabilities);
  const totalLiabilities = totalCurrentLiabilities+existingSeniorDebt+existingSubDebt+otherLTLiabilities;
  const equity = totalAssets - totalLiabilities;
  return { totalCurrentAssets, totalAssets, totalCurrentLiabilities, totalLiabilities, equity, existingSeniorDebt, existingSubDebt, ar, inventory, realEstate };
}

// Three binding-constraint tests, same logic a bank underwriter runs: leverage multiple,
// debt-service coverage, and a borrowing-base/collateral ceiling. Whichever is lowest wins —
// that's the real capacity, not any single test in isolation.
function computeDebtCapacity(f, ebitda, bs, debtRatePct, debtTermYrs){
  const existingDebt = bs.existingSeniorDebt + bs.existingSubDebt;
  const leverageCapacity = Math.max(0, ebitda * n(f.maxLeverageMultiple) - existingDebt);

  const r = n(debtRatePct)/100, term = Math.max(1, n(debtTermYrs));
  const maxAnnualDebtService = n(f.minDSCR) > 0 ? ebitda / n(f.minDSCR) : 0;
  const dscrCapacity = Math.max(0, r === 0 ? maxAnnualDebtService * term : maxAnnualDebtService * (1 - Math.pow(1+r, -term)) / r);

  const borrowingBase = Math.max(0,
    bs.ar * (n(f.arAdvanceRate)/100) +
    bs.inventory * (n(f.invAdvanceRate)/100) +
    bs.realEstate * (n(f.reAdvanceRate)/100)
  );

  const tests = [
    { name:'Leverage (EBITDA multiple)', value:leverageCapacity },
    { name:'DSCR / Cash Flow', value:dscrCapacity },
    { name:'Collateral / Borrowing Base', value:borrowingBase },
  ];
  const binding = tests.reduce((min,t)=> t.value < min.value ? t : min, tests[0]);
  return { leverageCapacity, dscrCapacity, borrowingBase, bindingCapacity: Math.max(0, binding.value), bindingName: binding.name, tests };
}

/* ---------------------------- Cost-of-capital defaults --------------------------- */
// Sourced, not invented: sponsor target IRR and mezz pricing pulled from 2026
// lower-middle-market data (Lincoln International Q2 2026 Middle Market Perspectives;
// CT Acquisitions 2026 LMM guides; PitchBook Q1 2026 US PE Middle Market Report).
// All of it is editable per deal — these are starting points, not quotes.
function defaultCostInputs(){
  return {
    amountNeeded: '',
    debtRate: 9.5, debtTerm: 5, debtFees: 2,
    mezzCoupon: 11, mezzPik: 3, mezzBlendedIRR: 16,
    equityIRR: 22, equityHold: 5, exitEbitda: '', exitMultiple: 6,
  };
}
function computeDebtCost(amount, ratePct, termYrs, feesPct){
  const r = ratePct/100, n = Math.max(1, termYrs);
  const payment = r === 0 ? amount/n : amount * r / (1 - Math.pow(1+r, -n));
  const totalPayments = payment * n;
  const totalInterest = totalPayments - amount;
  const feesAmt = amount * (feesPct/100);
  const annualDollarCost = (totalInterest + feesAmt) / n;
  // Effective rate = nominal rate plus fees spread evenly over the term. (Total interest
  // divided by original-principal-times-term would understate this, since it averages
  // against the full original balance even in later years when it's been paid down —
  // that's not a number you can honestly compare against a quoted rate.)
  const effectiveAnnualPct = ratePct + (feesPct / n);
  return { annualPayment: payment, totalInterest, feesAmt, annualDollarCost, effectiveAnnualPct };
}
function computeMezzCost(amount, cashCouponPct, pikPct, blendedIrrPct){
  const annualCashCost = amount * (cashCouponPct/100);
  const annualBlendedCost = amount * (blendedIrrPct/100);
  return { annualCashCost, annualBlendedCost, effectiveAnnualPct: blendedIrrPct };
}
function computeEquityCost(amount, targetIrrPct, holdYrs, exitEbitda, exitMultiple){
  const r = targetIrrPct/100, n = Math.max(1, holdYrs);
  const exitValueOwed = amount * Math.pow(1+r, n);
  const totalReturnToInvestor = exitValueOwed - amount;
  const avgAnnualDollarCost = totalReturnToInvestor / n;
  let impliedExitValue = null, impliedOwnershipPct = null;
  if(Number(exitEbitda) > 0 && Number(exitMultiple) > 0){
    impliedExitValue = Number(exitEbitda) * Number(exitMultiple);
    impliedOwnershipPct = impliedExitValue > 0 ? (exitValueOwed / impliedExitValue) * 100 : null;
  }
  return { exitValueOwed, totalReturnToInvestor, avgAnnualDollarCost, effectiveAnnualPct: targetIrrPct, impliedExitValue, impliedOwnershipPct };
}

/* ---------------------------- Sale / exit analysis --------------------------- */
// Sourced defaults, same discipline as the debt/mezz/equity assumptions: LMM EBITDA
// multiples run roughly 5-7x depending on size and sector (per the same 2026 LMM data
// used elsewhere in this tool); revenue multiples vary far more by industry and margin
// profile, so that figure is a sanity-check cross-reference, not a primary driver.
function defaultSaleInputs(){
  return {
    saleEbitdaMultiple: 5.5,
    saleRevenueMultiple: 1.0,
    transactionCostPct: 3,
    blendedTaxRate: 30,
  };
}

function computeSaleAnalysis(f, si){
  const is = computeIncomeStatement(f);
  const bs = computeBalanceSheet(f);
  const evFromEbitda = is.ebitda * n(si.saleEbitdaMultiple);
  const evFromRevenue = is.revenue * n(si.saleRevenueMultiple);
  const netDebt = bs.existingSeniorDebt + bs.existingSubDebt;
  const transactionCosts = evFromEbitda * (n(si.transactionCostPct)/100);
  const netProceedsBeforeTax = Math.max(0, evFromEbitda - netDebt - transactionCosts);
  // Directional only: applies the blended rate to total proceeds, not to gain over cost basis
  // (basis isn't captured here). Actual tax is very likely lower than this once basis is
  // accounted for — this deliberately errs conservative rather than under-stating it.
  const estimatedTaxes = netProceedsBeforeTax * (n(si.blendedTaxRate)/100);
  const netProceedsAfterTax = Math.max(0, netProceedsBeforeTax - estimatedTaxes);
  return { ebitda: is.ebitda, revenue: is.revenue, evFromEbitda, evFromRevenue, netDebt, transactionCosts, netProceedsBeforeTax, estimatedTaxes, netProceedsAfterTax };
}

/* ---------------------------- Scoring --------------------------- */
function scoreAssessment(a){
  let debt=0, mezz=0, equity=0;
  const add = (d,m,e)=>{ debt+=d; mezz+=m; equity+=e; };

  switch(a.controlTolerance){
    case 'keep100': add(3,1,0); break;
    case 'minority': add(0,2,1); break;
    case 'majority': add(0,0,3); break;
  }
  switch(a.dilutionTolerance){
    case 'none': add(3,0,0); break;
    case 'upto20': add(1,2,0); break;
    case '20to49': add(0,1,2); break;
    case 'majority': add(0,0,3); break;
  }
  switch(a.cashFlow){
    case 'stable': add(3,1,0); break;
    case 'growing': add(1,2,1); break;
    case 'preprofit': add(-2,0,3); break;
  }
  switch(a.leverage){
    case 'light': add(2,1,0); break;
    case 'moderate': add(0,1,1); break;
    case 'heavy': add(-2,1,2); break;
  }
  const secured = (a.collateral||[]).some(c=>c!=='none') && (a.collateral||[]).length>0;
  if(secured) add(2,1,0); else add(0,1,1);

  switch(a.useOfProceeds){
    case 'acquisition': add(0,1,1); break;
    case 'recap': add(0,1,2); break;
    case 'refi': case 'workingcapital': add(2,0,0); break;
    case 'growth': add(1,1,0); break;
  }
  switch(a.timeline){
    case 'urgent': add(2,0,-1); break;
    case 'flexible': add(0,0,1); break;
  }

  // Hard overrides — situations where the math above could technically favor debt
  // but the deal is not one a lender will underwrite, or is structurally an M&A
  // transaction rather than a financing.
  let bucket;
  if(a.useOfProceeds === 'fullsale' || a.controlTolerance === 'majority'){
    bucket = 'sale'; // explicit full-sale intent, or willingness to give up control entirely — either way this is a sale conversation, not a capital raise
  } else if(a.cashFlow === 'preprofit' && !secured){
    bucket = 'equity';
  } else {
    if(debt >= mezz && debt >= equity) bucket = 'debt';
    else if(mezz >= equity) bucket = 'mezz';
    else bucket = 'equity';
  }
  return { debt, mezz, equity, bucket };
}

function blankDraft(){
  return { prospectName:'', companyName:'', useOfProceeds:'', controlTolerance:'', dilutionTolerance:'',
    collateral:[], leverage:'', timeline:'', cashFlow:'', ownershipGoal:'', costInputs: defaultCostInputs(),
    financials: defaultFinancials(), saleInputs: defaultSaleInputs() };

async function loadAssessments(){
  try{
    const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending:false });
    if(error) throw error;
    assessments = data || [];
    loadError = '';
  }catch(e){
    console.error('load failed', e);
    assessments = [];
    loadError = (e && (e.message || e.error_description || e.msg)) || 'Unknown error loading saved assessments — see browser console.';
  }
  render();
}

async function persistAssessment(a){
  saveState = 'saving'; lastSaveError = ''; render();
  const payload = {
    prospect_name: a.prospectName || null, company_name: a.companyName || null,
    inputs: {
      useOfProceeds:a.useOfProceeds, controlTolerance:a.controlTolerance, dilutionTolerance:a.dilutionTolerance,
      collateral:a.collateral, leverage:a.leverage, timeline:a.timeline, cashFlow:a.cashFlow, ownershipGoal:a.ownershipGoal,
      costInputs: a.costInputs, financials: a.financials, saleInputs: a.saleInputs
    },
    recommended_bucket: a.result ? a.result.bucket : null,
  };
  try{
    if(a.id){
      const { error } = await sb.from(TABLE).update(payload).eq('id', a.id);
      if(error) throw error;
    } else {
      const { data, error } = await sb.from(TABLE).insert(payload).select().single();
      if(error) throw error;
      a.id = data.id;
    }
    saveState = 'saved';
    await loadAssessments();
    currentId = a.id;
  }catch(e){
    console.error('save failed', e);
    saveState = 'error';
    lastSaveError = (e && (e.message || e.error_description || e.msg)) || 'Unknown error — see browser console.';
    render();
  }
}

function startNew(){
  draft = blankDraft();
  currentId = null;
  view = 'new';
  render();
}

function openSaved(id){
  const rec = assessments.find(x=>x.id===id);
  if(!rec) return;
  draft = { prospectName: rec.prospect_name||'', companyName: rec.company_name||'', ...rec.inputs };
  if(!draft.costInputs) draft.costInputs = defaultCostInputs(); // older saved records won't have this yet
  if(!draft.financials) draft.financials = defaultFinancials(); // older saved records won't have this yet
  if(!draft.saleInputs) draft.saleInputs = defaultSaleInputs(); // older saved records won't have this yet
  draft.result = scoreAssessment(draft);
  currentId = id;
  view = 'result';
  render();
}

// Recomputes and patches just the three output blocks in place, so typing in a
// cost-assumption field doesn't force a full re-render (which would blow away
// focus/cursor position mid-keystroke).
// Single source of truth for the whole results view: computes the income statement,
// balance sheet, three-test debt capacity, and how the total need splits between
// debt (up to capacity) and the gap that mezz/equity have to cover.
function computeCapitalStackSplit(d){
  const f = d.financials, ci = d.costInputs;
  const is = computeIncomeStatement(f);
  const bs = computeBalanceSheet(f);
  const capacity = computeDebtCapacity(f, is.ebitda, bs, ci.debtRate, ci.debtTerm);
  const totalNeed = Number(ci.amountNeeded) || 0;
  const debtAmount = Math.min(capacity.bindingCapacity, totalNeed);
  const gap = Math.max(0, totalNeed - debtAmount);
  return { is, bs, capacity, totalNeed, debtAmount, gap };
}

function waterfallHtml(split){
  const { is, capacity, totalNeed, debtAmount, gap } = split;
  const hasFinancials = is.revenue > 0 || is.ebitda !== 0;

  const rows = capacity.tests.map(t=>{

    return `<div class="wf-row ${isBinding?'binding':''}"><span class="wf-label">${escapeHtml(t.name)}${isBinding?' — binding':''}</span><span class="wf-val">${fmtMoney(t.value)}</span></div>`;

  return `

    <div class="wf-split">
      <div class="wf-split-cell"><div class="wf-split-lbl">Total Capital Need</div><div class="wf-split-val">${fmtMoney(totalNeed)}</div></div>
      <div class="wf-split-cell"><div class="wf-split-lbl">Debt Capacity Available</div><div class="wf-split-val">${fmtMoney(debtAmount)}</div></div>
      <div class="wf-split-cell"><div class="wf-split-lbl">Gap (Mezz + Equity)</div><div class="wf-split-val">${fmtMoney(gap)}</div></div>
    </div>
  `;
}

function renderCapacityWaterfall(d){
  const split = computeCapitalStackSplit(d);
  return `
    <div class="bucket-card">
      <h3>Debt Capacity Waterfall</h3>
      <div id="waterfallOutput">${waterfallHtml(split)}</div>
    </div>
  `;
}

function updateCostOutputs(){
  const split = computeCapitalStackSplit(draft);
  const ci = draft.costInputs;
  const wfEl = $('waterfallOutput'); if(wfEl) wfEl.innerHTML = waterfallHtml(split);
  const debtEl = $('debtOutput'), mezzEl = $('mezzOutput'), equityEl = $('equityOutput');
  if(debtEl) debtEl.innerHTML = debtOutputHtml(computeDebtCost(split.debtAmount, ci.debtRate, ci.debtTerm, ci.debtFees));
  if(mezzEl) mezzEl.innerHTML = mezzOutputHtml(computeMezzCost(split.gap, ci.mezzCoupon, ci.mezzPik, ci.mezzBlendedIRR));
  if(equityEl) equityEl.innerHTML = equityOutputHtml(computeEquityCost(split.gap, ci.equityIRR, ci.equityHold, ci.exitEbitda, ci.exitMultiple));
  const headEl = $('costCompareHeading'); if(headEl) headEl.textContent = `Cost of Capital Comparison — Debt ${fmtMoney(split.debtAmount)} / Gap ${fmtMoney(split.gap)}`;
}

function renderCostComparison(d){
  const ci = d.costInputs;
  const split = computeCapitalStackSplit(d);
  const debtR = computeDebtCost(split.debtAmount, ci.debtRate, ci.debtTerm, ci.debtFees);
  const mezzR = computeMezzCost(split.gap, ci.mezzCoupon, ci.mezzPik, ci.mezzBlendedIRR);
  const equityR = computeEquityCost(split.gap, ci.equityIRR, ci.equityHold, ci.exitEbitda, ci.exitMultiple);

  return `
    <div class="bucket-card">
      <h3 id="costCompareHeading">Cost of Capital Comparison — Debt ${fmtMoney(split.debtAmount)} / Gap ${fmtMoney(split.gap)}</h3>
      <div class="cost-note-top">Debt is sized to the computed capacity above (capped at what's actually needed). Mezz and equity are compared on whatever's left — the real gap, not a guess. Mezz/equity assumptions are seeded from 2026 lower-middle-market benchmarks (Lincoln International Q2 2026 Middle Market Perspectives; general LMM PE return data) — starting points to adjust per deal, not quotes.</div>
      <div class="cost-compare-grid">
        <div class="cost-col">
          <div class="cost-col-head">Debt</div>
          <label>Rate (%)</label><input data-cost="debtRate" type="number" step="0.1" value="${ci.debtRate}">
          <label>Term (yrs)</label><input data-cost="debtTerm" type="number" step="1" value="${ci.debtTerm}">
          <label>Upfront Fees (%)</label><input data-cost="debtFees" type="number" step="0.1" value="${ci.debtFees}">
          <div class="cost-output" id="debtOutput">${debtOutputHtml(debtR)}</div>
        </div>
        <div class="cost-col">
          <div class="cost-col-head">Debt + Mezzanine</div>
          <label>Cash Coupon (%)</label><input data-cost="mezzCoupon" type="number" step="0.1" value="${ci.mezzCoupon}">
          <label>PIK (%)</label><input data-cost="mezzPik" type="number" step="0.1" value="${ci.mezzPik}">
          <label>Blended Target IRR (%)</label><input data-cost="mezzBlendedIRR" type="number" step="0.1" value="${ci.mezzBlendedIRR}">
          <div class="cost-output" id="mezzOutput">${mezzOutputHtml(mezzR)}</div>
        </div>
        <div class="cost-col">
          <div class="cost-col-head">Equity</div>
          <label>Sponsor Target IRR (%)</label><input data-cost="equityIRR" type="number" step="0.5" value="${ci.equityIRR}">
          <label>Hold Period (yrs)</label><input data-cost="equityHold" type="number" step="1" value="${ci.equityHold}">
          <label>Exit EBITDA ($, optional)</label><input data-cost="exitEbitda" type="number" step="10000" value="${ci.exitEbitda}" placeholder="e.g. 3000000">
          <label>Exit Multiple (x EBITDA)</label><input data-cost="exitMultiple" type="number" step="0.5" value="${ci.exitMultiple}" placeholder="e.g. 5">
          <div class="cost-output" id="equityOutput">${equityOutputHtml(equityR)}</div>
        </div>
      </div>
    </div>
  `;
}

function saleOutputHtml(sale, si){
  const hasFinancials = sale.ebitda > 0 || sale.revenue > 0;
  if(!hasFinancials){
    return `<div class="cost-note-top">No financials entered — go back to the intake form and fill in the Income Statement / Balance Sheet to get a real proceeds estimate.</div>`;
  }
  return `
    <div class="cost-note-top">Enterprise value driven off the EBITDA multiple. The revenue multiple is a cross-check only — not fed into the waterfall — since revenue multiples vary enormously by industry and margin profile.</div>
    <div class="wf-split" style="margin-bottom:16px;">
      <div class="wf-split-cell"><div class="wf-split-lbl">EV — EBITDA Method</div><div class="wf-split-val">${fmtMoney(sale.evFromEbitda)}</div></div>
      <div class="wf-split-cell"><div class="wf-split-lbl">EV — Revenue Method (x-check)</div><div class="wf-split-val">${fmtMoney(sale.evFromRevenue)}</div></div>
    </div>
    <div class="wf-tests">
      <div class="wf-row"><span class="wf-label">Enterprise Value (EBITDA method)</span><span class="wf-val">${fmtMoney(sale.evFromEbitda)}</span></div>
      <div class="wf-row"><span class="wf-label">Less: Existing Debt Payoff</span><span class="wf-val">(${fmtMoney(sale.netDebt)})</span></div>
      <div class="wf-row"><span class="wf-label">Less: Transaction Costs</span><span class="wf-val">(${fmtMoney(sale.transactionCosts)})</span></div>
      <div class="wf-row binding"><span class="wf-label">Net Proceeds Before Tax</span><span class="wf-val">${fmtMoney(sale.netProceedsBeforeTax)}</span></div>
      <div class="wf-row"><span class="wf-label">Less: Estimated Taxes (directional)</span><span class="wf-val">(${fmtMoney(sale.estimatedTaxes)})</span></div>
      <div class="wf-row binding"><span class="wf-label">Est. Net Proceeds After Tax</span><span class="wf-val">${fmtMoney(sale.netProceedsAfterTax)}</span></div>
    </div>
    <div class="cost-note">The after-tax line applies a flat blended rate to total proceeds, not to gain over cost basis — actual tax is very likely lower once basis is factored in. This is a directional, conservative estimate only. Loop in a CPA before this number goes anywhere near a client.</div>
  `;
}

function updateSaleOutputs(){
  const sale = computeSaleAnalysis(draft.financials, draft.saleInputs);
  const el = $('saleOutput');
  if(el) el.innerHTML = saleOutputHtml(sale, draft.saleInputs);
}

function renderSaleAnalysis(d){
  const si = d.saleInputs;
  const sale = computeSaleAnalysis(d.financials, si);
  return `
    <div class="bucket-card">
      <h3>Sale / Exit Proceeds Estimate</h3>
      <div class="cost-compare-grid" style="grid-template-columns:1fr 1fr;">
        <div class="cost-col">
          <div class="cost-col-head">Valuation Assumptions</div>
          <label>EBITDA Multiple (x)</label><input data-sale="saleEbitdaMultiple" type="number" step="0.1" value="${si.saleEbitdaMultiple}">
          <label>Revenue Multiple (x, cross-check only)</label><input data-sale="saleRevenueMultiple" type="number" step="0.1" value="${si.saleRevenueMultiple}">
        </div>
        <div class="cost-col">
          <div class="cost-col-head">Deal Cost Assumptions</div>
          <label>Transaction Costs (% of EV)</label><input data-sale="transactionCostPct" type="number" step="0.5" value="${si.transactionCostPct}">
          <label>Blended Tax Rate (%, directional only)</label><input data-sale="blendedTaxRate" type="number" step="1" value="${si.blendedTaxRate}">
        </div>
      </div>
      <div id="saleOutput" style="margin-top:16px;">${saleOutputHtml(sale, si)}</div>
    </div>
  `;
}

function renderResult(){
  const d = draft;
  const r = d.result;
  const bucket = BUCKET_CONTENT[r.bucket];
  const total = Math.max(1, r.debt + r.mezz + r.equity);
  const cells = [['Debt', r.debt, r.bucket==='debt'],['Mezz', r.mezz, r.bucket==='mezz'],['Equity', r.equity, r.bucket==='equity']];

  const isSale = r.bucket === 'sale';
  const debtLinkHtml = r.bucket==='debt' || r.bucket==='mezz'
    ? `<div class="btn-row"><a class="btn" style="text-decoration:none;" href="${DEBT_CALC_URL}" target="_blank">Open Debt Capacity Calculator →</a></div>`
    : isSale
      ? `<div class="routing-note">This is an M&amp;A conversation — loop in whoever runs sell-side process. The estimate below is a directional read for an initial conversation, not a valuation opinion.</div>`
      : `<div class="routing-note">This is an equity conversation — loop in whoever's handling that relationship for the actual term sheet. The cost comparison below still shows what the equity route works out to at a glance.</div>`;

  const middleSectionHtml = isSale
    ? renderSaleAnalysis(d)
    : `${renderCapacityWaterfall(d)}\n${renderCostComparison(d)}`;

  return `
  <div class="main">
    <div class="btn-row" style="margin-bottom:20px;">
      <button class="btn btn-ghost" id="backToWizardBtn">← Edit Answers</button>
      <button class="btn btn-ghost" id="newFromResultBtn">+ New Assessment</button>
      <button class="btn" id="printReportBtn">Print / Save as PDF</button>
    </div>

    <div class="result-banner">
      <div class="result-eyebrow">${escapeHtml(bucket.eyebrow)}</div>
      <div class="result-title">${escapeHtml(bucket.title)}</div>
      <div class="result-desc">${escapeHtml(bucket.desc)}</div>
      <div class="score-strip">
        ${cells.map(([lbl,val,top])=>`<div class="score-cell ${top?'top':''}"><div class="score-lbl">${lbl} Signal</div><div class="score-val">${val}</div></div>`).join('')}
      </div>
    </div>

    <div class="bucket-card">
      <h3>Pros &amp; Cons</h3>
      <div class="pc-cols">
        <div class="pc-col pros"><h4>Pros</h4><ul>${bucket.pros.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul></div>
        <div class="pc-col cons"><h4>Cons</h4><ul>${bucket.cons.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul></div>
      </div>
    </div>

    ${middleSectionHtml}

    ${debtLinkHtml}

    <div class="save-note">
      ${saveState==='saved' ? 'Saved.' : saveState==='saving' ? 'Saving…' : saveState==='error' ? `Save failed: ${escapeHtml(lastSaveError)}` : ''}
      <button class="btn" style="margin-top:12px;" id="saveAssessBtn">${currentId?'Update Saved Assessment':'Save Assessment'}</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = $('app');
  app.innerHTML = renderSidebar() + (view==='result' ? renderResult() : renderWizard());
  wire();
}

function wire(){
  const newBtn = $('newAssessBtn'); if(newBtn) newBtn.onclick = startNew;
  const signOut = $('signOutBtn'); if(signOut) signOut.onclick = ()=>{ clearSession(); showAuthGate(); };
  const toolSwitcher = $('toolSwitcher'); if(toolSwitcher) toolSwitcher.onchange = ()=>{ if(toolSwitcher.value) window.location.href = toolSwitcher.value; };
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=> openSaved(el.dataset.open);
  });

  if(view==='new'){
    const pn = $('prospectName'); if(pn) pn.oninput = ()=>{ draft.prospectName = pn.value; };
    const cn = $('companyName'); if(cn) cn.oninput = ()=>{ draft.companyName = cn.value; };
    const an = $('amountNeeded'); if(an) an.oninput = ()=>{ draft.costInputs.amountNeeded = an.value; };
    document.querySelectorAll('[data-fin]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ draft.financials[inp.dataset.fin] = inp.value; });
    });
    document.querySelectorAll('.opt input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const step = STEPS.find(s=>s.key===inp.name);
        if(step.multi){
          const set = new Set(draft[step.key]||[]);
          if(inp.checked) set.add(inp.value); else set.delete(inp.value);
          draft[step.key] = Array.from(set);
        } else {
          draft[step.key] = inp.value;
        }
        render();
      });
    });
    const runBtn = $('runAssessBtn');
    if(runBtn) runBtn.onclick = ()=>{
      if(!isComplete(draft)) return;
      draft.result = scoreAssessment(draft);
      view = 'result';
      saveState = 'idle';
      render();
    };
  }

  if(view==='result'){
    const back = $('backToWizardBtn'); if(back) back.onclick = ()=>{ view='new'; render(); };
    const again = $('newFromResultBtn'); if(again) again.onclick = startNew;
    const save = $('saveAssessBtn'); if(save) save.onclick = ()=> persistAssessment(draft);
    const printBtn = $('printReportBtn'); if(printBtn) printBtn.onclick = ()=> window.print();
    document.querySelectorAll('[data-cost]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        draft.costInputs[inp.dataset.cost] = inp.value === '' ? 0 : Number(inp.value);
        updateCostOutputs();
      });
    });
    document.querySelectorAll('[data-sale]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        draft.saleInputs[inp.dataset.sale] = inp.value === '' ? 0 : Number(inp.value);
        updateSaleOutputs();
      });
    });
  }
}

(async function init(){
  draft = blankDraft();
  const session = await ensureValidSession();
  if(session){
    sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });
    enterApp();
  } else {
    showAuthGate();
  }
})();
</script>
</body>
</html>
